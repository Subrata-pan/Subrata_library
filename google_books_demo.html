<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Library - Google Books Search</title>
    <style>
        /* Global styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            color: #333;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header styles */
        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Search container */
        .search-container {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        #search-input {
            width: 70%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 30px;
            outline: none;
            transition: all 0.3s ease;
            background: white;
        }

        #search-input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        #search-button {
            padding: 15px 30px;
            font-size: 18px;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            margin-left: 15px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        #search-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        /* Results grid */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        /* Book card styles */
        .book-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .book-thumbnail {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: linear-gradient(45deg, #f5f5f5, #e0e0e0);
        }

        .book-info {
            padding: 20px;
        }

        .book-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            line-height: 1.3;
        }

        .book-author {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 8px;
            font-style: italic;
        }

        .book-year {
            font-size: 14px;
            color: #95a5a6;
            margin-bottom: 15px;
        }

        .book-link {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .book-link:hover {
            background: linear-gradient(45deg, #2980b9, #21618c);
            transform: scale(1.05);
        }

        /* Loading and error states */
        .loading {
            text-align: center;
            font-size: 24px;
            color: white;
            margin-top: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .loading::after {
            content: '';
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            text-align: center;
            font-size: 22px;
            color: #e74c3c;
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 2em;
            }

            #search-input {
                width: 80%;
                font-size: 16px;
            }

            #search-button {
                padding: 12px 24px;
                font-size: 16px;
                margin-left: 10px;
            }

            .results {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .book-card {
                margin: 0 auto;
            }

            .book-info {
                padding: 15px;
            }

            .book-title {
                font-size: 18px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .results {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1025px) {
            .results {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Online Library Search</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search for books...">
            <button id="search-button">🔍 Search</button>
        </div>
        <div id="results" class="results"></div>
    </div>

    <script>
        // DOM elements
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const resultsDiv = document.getElementById('results');

        // Event listeners
        searchButton.addEventListener('click', searchBooks);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchBooks();
            }
        });

        // Main search function
        async function searchBooks() {
            const query = searchInput.value.trim();
            if (!query) {
                alert('Please enter a book name to search.');
                return;
            }

            // Show loading animation
            resultsDiv.innerHTML = '<div class="loading">Searching for books...</div>';

            try {
                // Fetch data from Google Books API
                const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                // Check if books were found
                if (data.items && data.items.length > 0) {
                    displayBooks(data.items);
                } else {
                    resultsDiv.innerHTML = '<div class="error">No books found. Try a different search term.</div>';
                }
            } catch (error) {
                console.error('Error fetching books:', error);
                resultsDiv.innerHTML = '<div class="error">An error occurred while searching. Please try again.</div>';
            }
        }

        // Function to display books in grid
        function displayBooks(books) {
            resultsDiv.innerHTML = '';

            books.forEach(book => {
                const volumeInfo = book.volumeInfo;

                // Extract book details with fallbacks
                const thumbnail = volumeInfo.imageLinks ? volumeInfo.imageLinks.thumbnail : 'https://via.placeholder.com/200x300?text=No+Cover';
                const title = volumeInfo.title || 'Unknown Title';
                const authors = volumeInfo.authors ? volumeInfo.authors.join(', ') : 'Unknown Author';
                const publishedYear = volumeInfo.publishedDate ? new Date(volumeInfo.publishedDate).getFullYear() : 'Unknown Year';
                const previewLink = volumeInfo.previewLink || volumeInfo.infoLink || '#';

                // Create book card element
                const bookCard = document.createElement('div');
                bookCard.className = 'book-card';
                bookCard.innerHTML = `
                    <img src="${thumbnail}" alt="${title}" class="book-thumbnail" onerror="this.src='https://via.placeholder.com/200x300?text=No+Cover'">
                    <div class="book-info">
                        <div class="book-title">${title}</div>
                        <div class="book-author">by ${authors}</div>
                        <div class="book-year">Published: ${publishedYear}</div>
                        <a href="${previewLink}" target="_blank" class="book-link">📖 Read/Preview</a>
                    </div>
                `;

                resultsDiv.appendChild(bookCard);
            });
        }
    </script>
</body>
</html>

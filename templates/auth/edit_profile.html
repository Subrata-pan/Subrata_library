{% extends "base.html" %}

{% block title %}Edit Profile - KitabGhar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card">
      <div class="card-header">
        <h3 class="text-success mb-0"><i class="fas fa-user-edit"></i> Edit Profile</h3>
      </div>
      <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
          <div class="mb-3">
            <label class="form-label" for="first_name">First Name</label>
            <input class="form-control" type="text" id="first_name" name="first_name" value="{{ current_user.first_name or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label" for="last_name">Last Name</label>
            <input class="form-control" type="text" id="last_name" name="last_name" value="{{ current_user.last_name or '' }}">
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" value="{{ current_user.email }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="profile_image">Profile Picture</label>
            <input class="form-control" type="file" id="profile_image" name="profile_image" accept="image/png, image/jpeg">
          </div>
          <div class="d-grid">
            <button class="btn btn-success" type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

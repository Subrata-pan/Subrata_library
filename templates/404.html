{% extends "base.html" %}

{% block title %}Page Not Found - KitabGhar{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="text-center py-5">
            <i class="fas fa-exclamation-triangle text-warning" style="font-size: 4rem;"></i>
            <h1 class="display-4 text-info mt-4">404</h1>
            <h2 class="text-muted mb-4">Page Not Found</h2>
            <p class="text-muted mb-4">
                Sorry, the page you're looking for doesn't exist or has been moved.
            </p>
            <div class="d-flex gap-3 justify-content-center">
                <a href="{{ url_for('home') }}" class="btn btn-info">
                    <i class="fas fa-home me-2"></i>Go Home
                </a>
                <a href="{{ url_for('browse') }}" class="btn btn-outline-info">
                    <i class="fas fa-search me-2"></i>Browse Books
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
